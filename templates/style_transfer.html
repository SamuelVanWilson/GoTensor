<!DOCTYPE html>
<html>
<head>
    <title>Style Transfer</title>
</head>
<body>
    <h1>Style Transfer</h1>

    <form id="styleForm" method="POST" enctype="multipart/form-data">
        <label>Content Image:</label>
        <input type="file" name="content_image" required><br><br>
        <label>Style Image:</label>
        <input type="file" name="style_image" required><br><br>
        <button type="submit">Apply Style</button>
    </form>

    <h2>Hasil Style Transfer:</h2>
    <div id="output">
        {% if result %}
            <img src="{{ url_for('static', filename=result) }}" width="300">
        {% endif %}
    </div>
</body>
</html>
